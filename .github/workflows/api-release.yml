name: API Release

# The plugin API (clouseau-api) is released on its own, with its own version
# (ClouseauApi.VERSION), only when it changes. Tag the commit api-v<that version>,
# for example api-v0.2.0. App releases (v* tags, release.yml) don't publish it.

on:
  push:
    tags:
      - 'api-v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish the plugin API
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the tag names ClouseauApi.VERSION
        id: version
        shell: bash
        run: |
          VERSION="${TAG#api-v}"
          CODE="$(sed -n 's/.*VERSION *= *"\([^"]*\)".*/\1/p' clouseau-api/src/main/java/com/droidenx/clouseau/api/ClouseauApi.java)"
          if [[ "$VERSION" != "$CODE" ]]; then
            echo "::error::Tag $TAG names $VERSION, but ClouseauApi.VERSION is $CODE."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Every module builds on the API, so all of it must pass.
      - name: Run tests
        run: ./gradlew test

      # Signed when the SIGNING_KEY and SIGNING_PASSWORD secrets are set (Maven Central needs it).
      - name: Build the API jars
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :clouseau-api:publishAllPublicationsToStagingRepository

      # Maven Central (central.sonatype.com, namespace com.droidenx): upload the signed bundle
      # and wait for Central's checks, so a bundle it rejects fails the job before the GitHub
      # release exists. USER_MANAGED: the deployment then waits under Publish → Deployments
      # until someone clicks Publish there, because a version on Central can never be replaced.
      # Needs the CENTRAL_USERNAME / CENTRAL_PASSWORD secrets (a Portal user token); skipped
      # without them.
      - name: Upload to Maven Central
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [[ -z "$CENTRAL_USERNAME" || -z "$CENTRAL_PASSWORD" ]]; then
            echo "::notice::No CENTRAL_USERNAME / CENTRAL_PASSWORD secrets, so nothing goes to Maven Central."
            exit 0
          fi
          path="com/droidenx/clouseau/clouseau-api/$VERSION"
          # A re-run after Central already published this version has nothing to upload.
          if curl -sfI "https://repo1.maven.org/maven2/$path/clouseau-api-$VERSION.pom" > /dev/null; then
            echo "::notice::clouseau-api $VERSION is already on Maven Central."
            exit 0
          fi
          cd clouseau-api/build/staging-repo
          if ! compgen -G "$path/*.asc" > /dev/null; then
            echo "::error::The jars aren't signed (is the SIGNING_KEY secret set?), and Maven Central requires signatures."
            exit 1
          fi
          # The bundle is the version's folder in Maven layout: jars, POM, Gradle module file,
          # their .asc signatures and the checksums Gradle wrote next to them.
          zip -r "$RUNNER_TEMP/central-bundle.zip" "$path"
          token="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          echo "::add-mask::$token"
          api="https://central.sonatype.com/api/v1/publisher"
          id="$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" \
            -F "bundle=@$RUNNER_TEMP/central-bundle.zip" \
            "$api/upload?name=clouseau-api-$VERSION&publishingType=USER_MANAGED")"
          echo "Uploaded as deployment $id. Waiting for Maven Central's checks..."
          for _ in $(seq 60); do
            sleep 10
            status="$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" "$api/status?id=$id")"
            state="$(jq -r .deploymentState <<< "$status")"
            echo "  $state"
            case "$state" in
              VALIDATED)
                echo "::notice::Maven Central accepted clouseau-api $VERSION. Publish it at https://central.sonatype.com/publishing/deployments"
                exit 0 ;;
              PUBLISHING|PUBLISHED)
                exit 0 ;;
              FAILED)
                echo "::error::Maven Central rejected clouseau-api $VERSION (deployment $id):"
                jq '.errors' <<< "$status"
                exit 1 ;;
            esac
          done
          echo "::error::Maven Central was still checking deployment $id after 10 minutes. See Publish → Deployments at central.sonatype.com."
          exit 1

      - name: Create the release
        shell: bash
        run: |
          # A re-run finds the release already there and only uploads again.
          if gh release view "$TAG" > /dev/null 2>&1; then exit 0; fi
          prerelease=()
          # A pre-release while the API is 0.x, or with a suffix (api-v1.0.0-rc.1). GitHub shows the
          # newest full release as Latest even with --latest=false, and app releases are pre-releases.
          if [[ "$TAG" == api-v0.* || "$TAG" == *-*-* ]]; then prerelease=(--prerelease); fi
          # Notes written for plugin authors in docs/releases/<tag>.md, first line
          # "Title: <the release's title>", as for app releases. Else GitHub's list of commits.
          notes=(--generate-notes)
          file="docs/releases/$TAG.md"
          if [[ -f "$file" ]]; then
            title="$(head -n 1 "$file" | sed -n 's/^Title: *//p')"
            if [[ -n "$title" ]]; then
              tail -n +2 "$file" | sed '/./,$!d' > release-notes.md
              notes=(--title "$title" --notes-file release-notes.md)
            else
              notes=(--notes-file "$file")
            fi
          fi
          # Never "Latest": that stays the newest app release. The app's update check only
          # reads v<version> tags, so it never offers an API release (D-23).
          gh release create "$TAG" --verify-tag --latest=false "${notes[@]}" "${prerelease[@]}"

      - name: Upload the jars and the POM
        shell: bash
        run: |
          dir="clouseau-api/build/staging-repo/com/droidenx/clouseau/clouseau-api/${{ steps.version.outputs.VERSION }}"
          shopt -s nullglob
          gh release upload "$TAG" "$dir"/*.jar "$dir"/*.pom "$dir"/*.asc --clobber
