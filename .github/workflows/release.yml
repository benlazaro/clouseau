name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        shell: bash
        run: ./gradlew test

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build distribution zip
        shell: bash
        run: ./gradlew :clouseau-ui:distZipImage "-PappVersion=${{ steps.version.outputs.VERSION }}"

      - name: Rename zip with platform suffix
        shell: bash
        run: |
          mv clouseau-ui/build/distributions/clouseau-${{ steps.version.outputs.VERSION }}.zip \
             clouseau-ui/build/distributions/clouseau-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}.zip

      - name: Keep the zip for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: clouseau-${{ matrix.platform }}
          path: clouseau-ui/build/distributions/clouseau-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 1

  # The builds run in parallel and finish in any order, so they only hand their zips over.
  # This job creates the release once all three passed, and uploads the zips one at a time,
  # Windows first.
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}

    steps:
      - name: Download the zips
        uses: actions/download-artifact@v8
        with:
          pattern: clouseau-*
          path: dist
          merge-multiple: true

      - name: Create the release
        shell: bash
        run: |
          # A re-run finds the release already there and only uploads again.
          if gh release view "$TAG" > /dev/null 2>&1; then exit 0; fi
          # A version with a pre-release part (v0.12.0-alpha, v1.0.0-rc.1) is a pre-release,
          # which the update check offers only to pre-release users (D-23).
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --verify-tag --generate-notes "${prerelease[@]}"

      - name: Upload the zips, Windows first
        shell: bash
        run: |
          VERSION="${TAG#v}"
          for platform in windows macos linux; do
            gh release upload "$TAG" "dist/clouseau-$VERSION-$platform.zip" --clobber
          done
