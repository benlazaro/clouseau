# =============================================================================
# Clouseau's additions to the built-in Light theme (FlatLightLaf). FlatLaf loads this
# file for FlatLightLaf because ClouseauApp registers this package as a custom
# defaults source; values here override FlatLaf's own.
# =============================================================================

# Log table rows are divided by hairlines (LogTableView's FlatLaf style class), in
# FlatLaf Light's separator gray.
[style].logTable = showHorizontalLines: true; showVerticalLines: false; gridColor: #CECECE

# Every other log row, when stripes are on (Settings → Table).
Clouseau.stripeBackground = #F4F5F7
