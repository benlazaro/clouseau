# =============================================================================
# Clouseau Light theme — FlatLaf properties file for ClouseauLightLaf.
# Loaded automatically by FlatLaf when ClouseauLightLaf is installed, because
# this file's name matches the LAF class name and the package is registered
# via FlatLaf.registerCustomDefaultsSource() in ClouseauApp.
#
# The same design as ClouseauDarkLaf.properties, with colors chosen for white:
# - a neutral, slightly cool gray ramp: white reading surfaces and fields on a
#   light gray window;
# - a pale blue selection with dark text and a visible ring;
# - the logo's amber as the only accent, for what is active, darkened where it is
#   a line or text so it holds 3:1 (lines) and 4.5:1 (text) on white;
# - fields and buttons outlined, as in IntelliJ's settings;
# - text and level colors that reach 4.5:1 on every row background (white, the
#   selection, a find match, a stripe and all eight highlights).
# =============================================================================

# ── Core palette variables ────────────────────────────────────────────────────
@background          = #F7F8FA
@componentBackground = #FFFFFF
@foreground          = #1F2329
@disabledForeground  = #5C636D
# Neutral on purpose: FlatLaf derives list and menu selection from it.
@accentColor         = #DFE3EA

# ── Menu bar & popup ──────────────────────────────────────────────────────────
@menuBackground               = #FFFFFF
MenuBar.background            = @background
MenuBar.borderColor           = @background
MenuBar.hoverBackground       = #EBEDF2
PopupMenu.borderColor         = #C9CCD3

# ── Standard FlatLaf UI overrides ─────────────────────────────────────────────
Table.background              = #FFFFFF
Table.alternateRowColor       = #FFFFFF
# No Table.selectionBackground: tables in dialogs take the neutral list selection, as in Dark.
TextArea.background           = #FFFFFF
TextPane.background           = #FFFFFF
Separator.foreground          = #E3E5EA
Component.borderColor         = #D0D3DA
TabbedPane.showTabSeparators  = true
TabbedPane.tabArc             = 10
TabbedPane.underlineHeight    = 2
TabbedPane.selectedBackground     = #FFFFFF
TabbedPane.underlineColor         = #C47A0F
TabbedPane.inactiveUnderlineColor = #D9B57A
ScrollBar.thumbArc            = 999
# Log table rows need no lines, as in Dark; stripes are a setting (Settings → Table).
[style].logTable              = showHorizontalLines: false; showVerticalLines: false
# Menus and popups follow the 4px corner rule, as in Dark (see there for why the shadow stays on).
MenuBar.selectionArc          = 8
MenuBar.selectionInsets       = 0,0,0,0
MenuBar.selectionEmbeddedInsets = 0,0,0,0
MenuItem.selectionArc         = 8
MenuItem.selectionInsets      = 0,4,0,4
Popup.borderCornerRadius      = 4
PopupMenu.borderCornerRadius  = 4

# Chrome text (menus, the window title, tab titles) is darker than log text: 17:1.
Menu.foreground                   = #0F1216
MenuItem.foreground               = #0F1216
CheckBoxMenuItem.foreground       = #0F1216
RadioButtonMenuItem.foreground    = #0F1216
TitlePane.foreground              = #0F1216
TabbedPane.foreground             = #0F1216

# Controls follow IntelliJ's settings style, as in Dark: fields and buttons outlined,
# 4px corners (an arc of 8) and room inside. Fields and buttons are white on the gray
# window; a button has centered text. Borders are 2.3:1 on the window.
TextField.background              = #FFFFFF
FormattedTextField.background     = #FFFFFF
PasswordField.background          = #FFFFFF
Spinner.background                = #FFFFFF
TextField.foreground              = #1F2329
FormattedTextField.foreground     = #1F2329
PasswordField.foreground          = #1F2329
TextField.placeholderForeground   = #6E7580
FormattedTextField.placeholderForeground = #6E7580
TextField.margin                  = 4,8,4,8
FormattedTextField.margin         = 4,8,4,8
PasswordField.margin              = 4,8,4,8
[style]TextField                  = borderColor: #A3A8B1
[style]FormattedTextField         = borderColor: #A3A8B1
[style]PasswordField              = borderColor: #A3A8B1
# Drop-downs are filled a step darker, so they read as pickers rather than text boxes.
ComboBox.background               = #F0F2F5
ComboBox.buttonBackground         = #F0F2F5
ComboBox.buttonEditableBackground = #F0F2F5
[style]ComboBox                   = borderColor: #A3A8B1

Component.arc                     = 8
TextComponent.arc                 = 8
Button.arc                        = 8
Button.margin                     = 4,14,4,14
Button.background                 = #FFFFFF
Button.foreground                 = #1F2329
Button.borderColor                = #A3A8B1
# Hover stays neutral gray; amber is for focus and the active choice.
Button.hoverBackground            = #F0F2F5
Button.hoverBorderColor           = #8E949E
Button.pressedBackground          = #E6E9EE
# The default button of a dialog (OK, Save…) is the one filled button: amber with dark
# text (8.3:1). Its focus ring is dark, since amber on amber would vanish.
Button.default.background         = #E0A243
Button.default.foreground         = #1A1206
Button.default.borderColor        = #C9891F
Button.default.hoverBackground    = #E8B05A
Button.default.hoverBorderColor   = #C9891F
Button.default.pressedBackground  = #D0943A
Button.default.focusColor         = #1A1206
Button.default.focusedBorderColor = #1A1206
# Toggles (level filters, Follow) are outlined when off and filled when on.
ToggleButton.background           = #F7F8FA
ToggleButton.selectedBackground   = #E1E5EC
ToggleButton.selectedForeground   = #0F1216
[style]ToggleButton               = borderColor: #C9CCD3
# Checked boxes are filled with the accent, with a dark checkmark.
CheckBox.icon.background          = #FFFFFF
CheckBox.icon.borderColor         = #A3A8B1
CheckBox.icon.selectedBackground  = #E0A243
CheckBox.icon.selectedBorderColor = #C9891F
CheckBox.icon.checkmarkColor      = #1A1206

# Keyboard focus: drawn inside the border, in the accent darkened to 3.2:1 on the window.
Component.focusWidth          = 0
Component.innerFocusWidth     = 1
Button.innerFocusWidth        = 1
Component.focusColor          = #C47A0F
Component.focusedBorderColor  = #C47A0F

# ── Surface ramp ──────────────────────────────────────────────────────────────
# #ffffff  table, detail pane, fields, menus, active tab
# #f7f8fa  window background
# #f0f2f5  drop-downs, hover
# #ebedf2  menu-bar hover
Clouseau.viewportBackground   = #FFFFFF
Clouseau.loadingBackground    = #FFFFFF

# ── Welcome panel key-badge chip ──────────────────────────────────────────────
Clouseau.keyBadgeFill         = #FFFFFF
Clouseau.keyBadgeBorder       = #C9CCD3

# ── Foreground / text ─────────────────────────────────────────────────────────
Clouseau.mutedForeground      = #646B75
Clouseau.accentBlue           = #0A5799
Clouseau.detailKeyColor       = #0A5799
Clouseau.offColor             = #8A9099
# A picker button whose filter is on (the time range): a dark amber, 5.7:1 on the window
Clouseau.activeFilterForeground = #8F5600

# ── Log-level foreground colors (4.5:1 or more on every row background) ──────
Clouseau.level.TRACE          = #5E6570
Clouseau.level.DEBUG          = #226826
Clouseau.level.INFO           = #0A62A6
Clouseau.level.WARN           = #8C4F00
Clouseau.level.ERROR          = #BB2424
Clouseau.level.FATAL          = #B81656
Clouseau.level.UNKNOWN        = #5E6570

# ── Status / feedback colors ──────────────────────────────────────────────────
Clouseau.status.ok            = #226826
Clouseau.status.warn          = #8C4F00
Clouseau.status.error         = #BB2424

# ── Selection & search ────────────────────────────────────────────────────────
Clouseau.selectionBackground  = #D4E4F7
Clouseau.selectionForeground  = #0F1216
Clouseau.selectionRing        = #3D78B8
Clouseau.selectionRingInactive = #A3A8B1
Clouseau.findMarkBg          = #1F23291A
Clouseau.findMarkBorder      = #3B4048B3
# Every other log row, when stripes are on (Settings → Table)
Clouseau.stripeBackground     = #F5F6F8

# ── Row-highlight palette (8 slots, index 0-7) ───────────────────────────────
# One lightness and saturation (OKLCH L 0.94, C 0.045): red, amber, olive, green,
# teal, blue, violet, plum.
Clouseau.highlight.0          = #FFE0DC
Clouseau.highlight.1          = #FFE7CB
Clouseau.highlight.2          = #EFEDCB
Clouseau.highlight.3          = #D7F4DC
Clouseau.highlight.4          = #CAF5F2
Clouseau.highlight.5          = #D5EEFF
Clouseau.highlight.6          = #EFE5FF
Clouseau.highlight.7          = #FFE0F2

# ── Logger-tree depth colors (depth 0 = top-level, wraps after depth 4) ──────
Clouseau.logger.depth.0       = #1F2329
Clouseau.logger.depth.1       = #0A62A6
Clouseau.logger.depth.2       = #226826
Clouseau.logger.depth.3       = #8C4F00
Clouseau.logger.depth.4       = #BB2424

# ── Plugin status colors ──────────────────────────────────────────────────────
Clouseau.plugin.enabled       = #226826
Clouseau.plugin.disabled      = #8C4F00
Clouseau.plugin.failed        = #BB2424

# ── Loading progress bar ──────────────────────────────────────────────────────
Clouseau.progressForeground   = #0A62A6
Clouseau.progressBackground   = #E3E5EA

# ── Detail panel flash animation ──────────────────────────────────────────────
Clouseau.flashPeakColor       = #C9CCD3

# ── Highlight navigation bar ──────────────────────────────────────────────────
Clouseau.highlightNav.selected   = #5C636D
Clouseau.highlightNav.unselected = #E3E5EA

# ── Note indicator (✎) and favorites star ─────────────────────────────────────
Clouseau.annotationIndicator  = #A86200
Clouseau.starColor            = #B38600

# ── JSON syntax-highlight palette (stored as Color, used as int rgb) ──────────
Clouseau.json.key             = #8E3F94
Clouseau.json.string          = #0B6E87
Clouseau.json.number          = #B04A10
Clouseau.json.boolNull        = #B04A10
Clouseau.json.punct           = #6B717B
