# =============================================================================
# Clouseau Dark theme — FlatLaf properties file for ClouseauDarkLaf.
# Loaded automatically by FlatLaf when ClouseauDarkLaf is installed, because
# this file's name matches the LAF class name and the package is registered
# via FlatLaf.registerCustomDefaultsSource() in ClouseauApp.
#
# Keys prefixed with @ are FlatLaf palette variables.
# Keys prefixed with Clouseau. are app-level UI defaults read by ClouseauColors.
# All other keys override standard FlatLaf / Swing UI defaults.
#
# The theme in short:
# - one neutral, slightly cool gray ramp, with separators and borders lighter
#   than the surfaces they divide;
# - a dark selection with light text and a visible ring;
# - the logo's amber as the only accent, for what is active: the tab underline,
#   keyboard focus, checked boxes, a set filter and a dialog's default button;
# - fields and buttons outlined, as in IntelliJ's settings;
# - text, level and JSON colors that reach 4.5:1 on every row background
#   (table, selection, find match and all eight highlights).
# =============================================================================

# ── Core palette variables ────────────────────────────────────────────────────
@background          = #232427
@componentBackground = #1f2023
@foreground          = #C9CED6
@disabledForeground  = #8B919B
# Neutral on purpose: FlatLaf derives list and menu selection from it.
@accentColor         = #4A4D54

# ── Menu bar & popup ──────────────────────────────────────────────────────────
@menuBackground               = #2E3034
MenuBar.background            = @background
MenuBar.borderColor           = @background
MenuBar.hoverBackground       = #383A3F
PopupMenu.borderColor         = #45484E

# ── Standard FlatLaf UI overrides ─────────────────────────────────────────────
Table.background              = #17181A
Table.alternateRowColor       = #17181A
Table.selectionBackground     = #22344A
Table.selectionForeground     = #E6EBF2
TextArea.background           = #17181A
TextPane.background           = #17181A
Separator.foreground          = #34363B
Component.borderColor         = #3F4247
TabbedPane.showTabSeparators  = true
TabbedPane.tabArc             = 10
TabbedPane.underlineHeight    = 2
TabbedPane.selectedBackground     = #2E3034
TabbedPane.underlineColor         = #E0A243
TabbedPane.inactiveUnderlineColor = #9A805A
ScrollBar.thumbArc            = 999
# Log table rows need no lines: the monospace columns and level colors already separate
# them. Stripes are a setting (Settings → Table), in Clouseau.stripeBackground below.
[style].logTable              = showHorizontalLines: false; showVerticalLines: false
MenuBar.selectionArc          = 8

# Chrome text (menus, the window title, tab titles) is brighter than log text, so the
# frame reads crisply: #E6EBF2 is 13:1 on the window. Log text stays @foreground.
Menu.foreground                   = #E6EBF2
MenuItem.foreground               = #E6EBF2
CheckBoxMenuItem.foreground       = #E6EBF2
RadioButtonMenuItem.foreground    = #E6EBF2
TitlePane.foreground              = #E6EBF2
TabbedPane.foreground             = #E6EBF2

# Controls follow IntelliJ's settings style. Fields and buttons are both outlined, with
# 4px corners (an arc of 8: FlatLaf's arc is the diameter) and room inside; a field has
# the window's own fill and placeholder text, a button brighter centered text. Borders
# are 2.4:1 on the window. Text fields take their corners from TextComponent.arc, not
# Component.arc, so it is set too.
TextField.background              = #232427
FormattedTextField.background     = #232427
PasswordField.background          = #232427
Spinner.background                = #232427
TextField.foreground              = #DDE1E7
FormattedTextField.foreground     = #DDE1E7
PasswordField.foreground          = #DDE1E7
TextField.placeholderForeground   = #9AA0AA
FormattedTextField.placeholderForeground = #9AA0AA
TextField.margin                  = 4,8,4,8
FormattedTextField.margin         = 4,8,4,8
[style]TextField                  = borderColor: #5A5E66
[style]FormattedTextField         = borderColor: #5A5E66
[style]PasswordField              = borderColor: #5A5E66
# Drop-downs are filled a step lighter, so they read as pickers rather than text boxes.
ComboBox.background               = #2A2C30
ComboBox.buttonBackground         = #2A2C30
ComboBox.buttonEditableBackground = #2A2C30
[style]ComboBox                   = borderColor: #5A5E66

Component.arc                     = 8
TextComponent.arc                 = 8
Button.arc                        = 8
Button.margin                     = 4,14,4,14
Button.background                 = #232427
Button.foreground                 = #DDE1E7
Button.borderColor                = #5A5E66
# Hover stays neutral gray; amber is for focus and the active choice.
Button.hoverBackground            = #2E3034
Button.hoverBorderColor           = #6B7079
Button.pressedBackground          = #383A3F
# The default button of a dialog (OK, Save…) is the one filled button: amber with dark
# text (8.3:1). Its focus ring is dark, since amber on amber would vanish.
Button.default.background         = #E0A243
Button.default.foreground         = #1A1206
Button.default.borderColor        = #E0A243
Button.default.hoverBackground    = #EAB35C
Button.default.hoverBorderColor   = #EAB35C
Button.default.pressedBackground  = #D0943A
Button.default.focusColor         = #17181A
Button.default.focusedBorderColor = #17181A
# Toggles (level filters, Follow) are outlined when off and filled when on.
ToggleButton.background           = #232427
ToggleButton.selectedBackground   = #44474E
ToggleButton.selectedForeground   = #E6EBF2
[style]ToggleButton               = borderColor: #4A4D54
# Checked boxes are filled with the accent, as IntelliJ fills them with its blue.
CheckBox.icon.background          = #232427
CheckBox.icon.borderColor         = #5A5E66
CheckBox.icon.selectedBackground  = #E0A243
CheckBox.icon.selectedBorderColor = #E0A243
CheckBox.icon.checkmarkColor      = #1A1206

# Keyboard focus: drawn inside the border (no outer focus width, so layouts don't shift),
# in the accent amber; at least 5.9:1 on every surface.
Component.focusWidth          = 0
Component.innerFocusWidth     = 1
Button.innerFocusWidth        = 1
Component.focusColor          = #E0A243
Component.focusedBorderColor  = #E0A243

# ── Surface ramp ──────────────────────────────────────────────────────────────
# #131416  deep: loading overlay, scroll viewport
# #17181a  table, detail pane
# #1f2023  component background
# #232427  window background
# #2e3034  menus, active tab
# #383a3f  hover
Clouseau.viewportBackground   = #131416
Clouseau.loadingBackground    = #131416

# ── Welcome panel key-badge chip ──────────────────────────────────────────────
Clouseau.keyBadgeFill         = #2A2C30
Clouseau.keyBadgeBorder       = #4A4D54

# ── Foreground / text ─────────────────────────────────────────────────────────
Clouseau.mutedForeground      = #868C96
Clouseau.accentBlue           = #82AAFF
Clouseau.detailKeyColor       = #7AA7D9
Clouseau.offColor             = #6B7079
# A picker button whose filter is on (the time range): the accent, 7.0:1 on the window
Clouseau.activeFilterForeground = #E0A243

# ── Log-level foreground colors ───────────────────────────────────────────────
Clouseau.level.TRACE          = #A3A8B0
Clouseau.level.DEBUG          = #6CC070
Clouseau.level.INFO           = #3DBCF5
Clouseau.level.WARN           = #FFAD3B
Clouseau.level.ERROR          = #FF6E6B
Clouseau.level.FATAL          = #FF6BA0
Clouseau.level.UNKNOWN        = #A3A8B0

# ── Status / feedback colors ──────────────────────────────────────────────────
Clouseau.status.ok            = #4CAF50
Clouseau.status.warn          = #FFA726
Clouseau.status.error         = #E57373

# ── Selection & search ────────────────────────────────────────────────────────
Clouseau.selectionBackground  = #22344A
Clouseau.selectionForeground  = #E6EBF2
Clouseau.selectionRing        = #6A95C4
Clouseau.searchMatchBg        = #352E12
# Every other log row, when stripes are on (Settings → Table)
Clouseau.stripeBackground     = #1B1C1F

# ── Row-highlight palette (8 slots, index 0-7) ───────────────────────────────
# One lightness and saturation (OKLCH L 0.30, C 0.07): red, amber, olive, green,
# teal, blue, violet, plum.
Clouseau.highlight.0          = #4B1D1B
Clouseau.highlight.1          = #442600
Clouseau.highlight.2          = #332F00
Clouseau.highlight.3          = #0D371A
Clouseau.highlight.4          = #003836
Clouseau.highlight.5          = #0D2F4F
Clouseau.highlight.6          = #33244B
Clouseau.highlight.7          = #461E36

# ── Logger-tree depth colors (depth 0 = top-level, wraps after depth 4) ──────
Clouseau.logger.depth.0       = #B0B7C3
Clouseau.logger.depth.1       = #82AAFF
Clouseau.logger.depth.2       = #C3E88D
Clouseau.logger.depth.3       = #FFCB6B
Clouseau.logger.depth.4       = #FF9580

# ── Plugin status colors ──────────────────────────────────────────────────────
Clouseau.plugin.enabled       = #66BB6A
Clouseau.plugin.disabled      = #FFA726
Clouseau.plugin.failed        = #EF5350

# ── Loading progress bar ──────────────────────────────────────────────────────
Clouseau.progressForeground   = #3DBCF5
Clouseau.progressBackground   = #34363B

# ── Detail panel flash animation ──────────────────────────────────────────────
Clouseau.flashPeakColor       = #8B919B

# ── Highlight navigation bar ──────────────────────────────────────────────────
Clouseau.highlightNav.selected   = #4A4D54
Clouseau.highlightNav.unselected = #2A2C30

# ── Favorites sidebar star icon ───────────────────────────────────────────────
Clouseau.starColor            = #FFD700

# ── JSON syntax-highlight palette (stored as Color, used as int rgb) ──────────
Clouseau.json.key             = #D896DA
Clouseau.json.string          = #8FD3E8
Clouseau.json.number          = #F0B37E
Clouseau.json.boolNull        = #F0B37E
Clouseau.json.punct           = #8A8F99
