# GitHub Pages site: https://benlazaro.github.io/clouseau/
# Built by GitHub Pages (Jekyll) from the root of main. The home page is index.html (its
# layout is _layouts/home.html) and the user guide is guide/*.md; everything else in the
# repository is excluded below. README.md is the repository's page on GitHub, not the site's.

title: Clouseau Log Viewer
description: A modern, pluggable desktop log viewer for software engineers.
url: https://benlazaro.github.io
baseurl: /clouseau

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  # Turns the guide's links between pages ([Installing](installing.md)) into .html links. GitHub
  # Pages runs it by default; naming it makes a local build (jekyll serve, Docker) do the same.
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

color_scheme: clouseau
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Download":
    - "https://github.com/benlazaro/clouseau/releases"
  "GitHub":
    - "https://github.com/benlazaro/clouseau"
aux_links_new_tab: true

footer_content: "Clouseau is MIT-licensed. <a href=\"https://github.com/benlazaro/clouseau/issues\">Report an issue</a>."

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/benlazaro/clouseau"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

# Only the home page and the user guide are published. The README and developer documents
# (docs/*.md, CLAUDE.md, CONTRIBUTING.md) stay readable on GitHub but aren't part of the site.
exclude:
  - README.md
  - CLAUDE.md
  - CONTRIBUTING.md
  - "docs/*.md"          # design notes, the road to 1.0, launch drafts: never on the site
  - docs/releases/
  - plugins.json
  - build/
  - gradle/
  - packaging/
  - samples/
  - data/
  - clouseau-api/
  - clouseau-core/
  - clouseau-plugin/
  - clouseau-ui/
  - clouseau-example-plugin/
  - gradlew
  - gradlew.bat
  - "*.gradle.kts"
  - gradle.properties
  - Gemfile
  - Gemfile.lock
  - vendor/
