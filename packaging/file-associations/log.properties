# jpackage --file-associations: makes the installed Clouseau open .log files on
# double-click and lists it under "Open with". Only .log is registered: .gz and .zip are
# general-purpose archives, and claiming them would take them over from the user's
# archive tool. Clouseau still opens them via File > Open or drag-and-drop.
extension=log
mime-type=text/x-log
description=Log file
