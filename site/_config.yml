# GitHub Pages site: https://benlazaro.github.io/clouseau/
# Everything the site publishes is in this folder, site/. The Pages workflow
# (.github/workflows/pages.yml) builds it with Jekyll on every push to main. The home page is
# index.html (its layout is _layouts/home.html), the user guide is guide/*.md, and the
# screenshots are in screenshots/. README.md, at the repository's root, is its page on GitHub.

title: Clouseau Log Viewer
description: A modern, pluggable desktop log viewer for software engineers.
url: https://benlazaro.github.io
baseurl: /clouseau

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  # Turns the guide's links between pages ([Installing](installing.md)) into .html links. GitHub
  # Pages runs it by default; naming it makes a local build (jekyll serve, Docker) do the same.
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

color_scheme: clouseau
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Download":
    - "https://github.com/benlazaro/clouseau/releases"
  "GitHub":
    - "https://github.com/benlazaro/clouseau"
aux_links_new_tab: true

footer_content: "Clouseau is MIT-licensed. <a href=\"https://github.com/benlazaro/clouseau/issues\">Report an issue</a>."

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/benlazaro/clouseau"
gh_edit_branch: "main"
gh_edit_source: site
gh_edit_view_mode: "tree"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
