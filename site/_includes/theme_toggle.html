{%- comment -%} The Dark/Light switch, in the home page's top bar and the guide's header. {%- endcomment -%}
<button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to the light theme" title="Switch to the light theme">
  <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
</button>
<script>
(function () {
  var b = document.getElementById('theme-toggle');
  if (!b || !window.clouseauTheme) return;
  var sync = function () {
    var label = 'Switch to the ' + (clouseauTheme.get() === 'light' ? 'dark' : 'light') + ' theme';
    b.setAttribute('aria-label', label);
    b.title = label;
  };
  b.addEventListener('click', function () { clouseauTheme.set(clouseauTheme.get() === 'light' ? 'dark' : 'light'); });
  document.addEventListener('clouseau-theme', sync);
  sync();
})();
</script>
